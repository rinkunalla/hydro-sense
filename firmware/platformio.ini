; Hydro Sense firmware. `pio run` builds the device image; `pio test -e native`
; runs pure-logic tests on the host (needs a host C++ compiler: npm run fw:test).

[platformio]
default_envs = esp32dev

[env]
; include/ holds config.h; libraries need it too.
build_flags =
    -I include
    -Wall
    -Wextra

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; No OTA in v1 (CLAUDE.md section 10), so one 3 MB app partition instead of two OTA slots.
board_build.partitions = huge_app.csv
; Same C++ standard as the native tests (Arduino core 2.0.17 defaults to gnu++11).
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    mikalhart/TinyGPSPlus@1.1.0
    tzapu/WiFiManager@2.0.17

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -std=gnu++17
