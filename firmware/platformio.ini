; Hydro Sense firmware. `pio run` builds the device image; `pio test -e native`
; runs pure-logic tests on the host (needs a host C++ compiler, see README).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
