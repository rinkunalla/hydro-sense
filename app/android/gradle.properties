# 2 GB is enough for this app; the template's 8 GB exceeds a 7-8 GB machine's RAM and
# the Android emulator gets killed while building.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Slow or unstable connections: wait up to 3 minutes per download instead of Gradle's default.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
